[package]
name = "macsweeper"
version = "0.1.0"
description = "MacSweeper - macOS 应用卸载与残留清理工具"
edition = "2021"
rust-version = "1.77"

[lib]
name = "macsweeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
rayon = "1"
base64 = "0.22"
icns = "0.3"
trash = "5"
walkdir = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
